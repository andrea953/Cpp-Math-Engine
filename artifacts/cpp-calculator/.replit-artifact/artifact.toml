kind = "web"
previewPath = "/"
title = "CPP Calculator"
version = "1.0.0"
id = "artifacts/cpp-calculator"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22254

[services.development]
run = "pnpm --filter @workspace/cpp-calculator run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cpp-calculator", "run", "build" ]
publicDir = "artifacts/cpp-calculator/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22254"
BASE_PATH = "/"
